name: Birds Meteo Android validation
on:
  push:
    branches: [birds-meteo]
  pull_request:
    branches: [birds-meteo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check SDK and project
        run: |
          java -version
          gradle -v
          test -f birds-meteo/settings.gradle.kts
      - name: Build and lint
        working-directory: birds-meteo
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator tests (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd birds-meteo && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify signature and checksum
        run: |
          APK=birds-meteo/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p output
          cp "$APK" output/Birds_Meteo_v0.8_RC_debug.apk
          (cd output && sha256sum Birds_Meteo_v0.8_RC_debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Birds_Meteo_v0.8_RC_debug
          path: output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation-reports
          path: |
            birds-meteo/app/build/reports/
            birds-meteo/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
